name: Daily Jira Report — Parth Shah

on:
  schedule:
    # Runs every weekday at 9:00 AM IST (3:30 AM UTC)
    - cron: "30 3 * * 1-5"
  workflow_dispatch:
    inputs:
      report_date:
        description: "Date to generate report for (YYYY-MM-DD). Defaults to today."
        required: false
        default: ""

jobs:
  generate-report:
    name: Generate Daily Jira Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_REPORTER_ACCOUNT_ID: ${{ secrets.JIRA_REPORTER_ACCOUNT_ID }}
        run: |
          DATE_ARG="${{ github.event.inputs.report_date }}"
          if [ -n "$DATE_ARG" ]; then
            python jira_daily_report.py "$DATE_ARG"
          else
            python jira_daily_report.py
          fi

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: daily Jira report $(date +%Y-%m-%d)"
          git push

      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jira-report-${{ github.run_id }}
          path: reports/
          retention-days: 30
